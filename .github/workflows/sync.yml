name: Sync Yandex Market orders to Notion

on:
  # GitHub Actions cron всегда в UTC. Europe/Moscow = UTC+3 круглый год (без перевода часов).
  # 06:00-20:00 MSK = 03:00-17:00 UTC, шаг 15 минут.
  schedule:
    - cron: "*/15 3-16 * * *"
    - cron: "0 17 * * *"
  workflow_dispatch: {}

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run sync
        run: npm run sync
        env:
          YM_API_KEY: ${{ secrets.YM_API_KEY }}
          YM_CAMPAIGN_ID: ${{ secrets.YM_CAMPAIGN_ID }}
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_DATABASE_ID: ${{ secrets.NOTION_DATABASE_ID }}
          TZ_NAME: ${{ secrets.TZ_NAME }}
